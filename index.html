<style>
/* Друкарська палітра: C M Y K + папір. Весь інтерфейс тримається на чотирьох фарбах. */
:root{--bg:#EDF0F5;--card:#FFFFFF;--tx:#15151C;--mu:#5E6678;--bd:#D9DEE8;--ac:#0B7FB8;--ac2:#DDF1FA;--ok:#12804A;--wr:#8A5A00;--er:#C81E3A;
--c:#1CB5E8;--m:#FF3E9B;--y:#FFD500;--k:#15151C;--btn:#15151C;--btx:#FFFFFF;--kt:#15151C;--ktx:#FFFFFF;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F14;--card:#171923;--tx:#ECEEF4;--mu:#9AA2B4;--bd:#2A2E3B;--ac:#3FC1F2;--ac2:#14303F;--ok:#3DD68C;--wr:#FFC53D;--er:#FF6B81;--k:#ECEEF4;--btn:#FFD500;--btx:#15151C;--kt:#272B38;--ktx:#ECEEF4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F14;--card:#171923;--tx:#ECEEF4;--mu:#9AA2B4;--bd:#2A2E3B;--ac:#3FC1F2;--ac2:#14303F;--ok:#3DD68C;--wr:#FFC53D;--er:#FF6B81;--k:#ECEEF4;--btn:#FFD500;--btx:#15151C;--kt:#272B38;--ktx:#ECEEF4;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;position:relative;background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
/* растр, як на друкованому відбитку: три шари крапок C, M, Y, що тануть донизу */
body::after{content:"";position:absolute;inset:0 0 auto 0;height:340px;z-index:-1;pointer-events:none;
background-image:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent) 1.7px,transparent 2.1px),radial-gradient(circle,color-mix(in srgb,var(--m) 36%,transparent) 1.7px,transparent 2.1px),radial-gradient(circle,color-mix(in srgb,var(--y) 60%,transparent) 1.7px,transparent 2.1px);
background-size:18px 18px;background-position:0 0,9px 5px,4px 11px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);padding:14px 16px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--c) 0 25%,var(--m) 25% 50%,var(--y) 50% 75%,var(--k) 75% 100%)}
h1{margin:0;flex:1;min-width:150px;display:flex;align-items:center;gap:11px;font:700 15px/1.15 Unbounded,Manrope,system-ui,sans-serif;letter-spacing:-.01em}
h1 #who{display:block;margin-top:3px;font:500 12px/1.2 Manrope,system-ui,sans-serif;letter-spacing:0}
.logo{flex:none}.logo circle{mix-blend-mode:multiply}.logo .c{fill:var(--c)}.logo .m{fill:var(--m)}.logo .y{fill:var(--y)}
:root[data-theme="dark"] .logo circle{mix-blend-mode:screen}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo circle{mix-blend-mode:screen}}
nav{display:flex;gap:2px;overflow-x:auto;width:100%;margin-top:4px}
nav button{flex:1;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--mu);font-weight:700;padding:10px 12px}
nav button:hover{color:var(--tx);border-color:transparent;transform:none;box-shadow:none}
nav button.on{color:var(--tx);border-bottom-color:var(--m)}
main{max-width:1000px;margin:0 auto;padding:16px 14px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1.5px solid var(--bd);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;transition:transform .08s,box-shadow .08s,border-color .12s}
button:hover{border-color:var(--tx)}
button.p{background:var(--btn);color:var(--btx);border-color:var(--btn)}
button.p:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--m);border-color:var(--btn)}
button.p:active{transform:none;box-shadow:none}
button.d{color:var(--er)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 55%,transparent);outline-offset:1px}
input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:8px;padding:9px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:9px 0 3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kg{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid>.card .row>button{flex:1 1 auto;min-width:0;padding:9px 10px}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.mu{color:var(--mu);font-size:13px}
.kpi{font:700 clamp(22px,4.6vw,30px)/1.1 Unbounded,Manrope,system-ui,sans-serif;letter-spacing:-.02em;margin-top:8px}
/* головна фішка: чотири плитки як зразки фарб на кольоровій шкалі */
.kt{border:0;padding:16px 16px 15px;min-height:104px;margin-bottom:0}
.kt .mu{color:inherit;opacity:.82;font-weight:600}
.kt .bar{background:rgba(255,255,255,.28)}.kt .bar i{background:currentColor}
.k1{background:var(--c);color:#06141B}.k2{background:var(--m);color:#220616}.k3{background:var(--y);color:#251E00}.k4{background:var(--kt);color:var(--ktx)}
.card.w0{border-left:6px solid var(--c)}.card.w1{border-left:6px solid var(--m)}.card.w2{border-left:6px solid var(--k)}.card.w3{border-left:6px solid var(--y)}.card.w4{border-left:6px solid #7C5CFF}.card.w5{border-left:6px solid var(--mu)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--ac2);color:var(--ac);margin:2px 3px 0 0}
.tag.w{background:color-mix(in srgb,var(--y) 30%,var(--card));color:var(--wr)}
.tag.e{background:color-mix(in srgb,var(--m) 16%,var(--card));color:var(--er)}
.tag.o{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
dialog{border:1px solid var(--bd);border-top:4px solid var(--m);border-radius:12px;background:var(--card);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:18px}
dialog h3{margin:0 0 8px;font:600 16px/1.2 Unbounded,Manrope,system-ui,sans-serif}
dialog::backdrop{background:color-mix(in srgb,#0A0B10 58%,transparent)}
.ch{overflow-x:auto}svg text{fill:var(--mu);font-size:11px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}th{color:var(--mu);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:520px){header{padding-left:12px;padding-right:12px;gap:6px}header>button{width:38px;min-width:0;min-height:38px;padding:0}h1{min-width:0;font-size:16px;gap:9px}.logo{width:30px;height:30px}}

/* ===== стиль «Етикетка»: інвентарні бейджі, квитки, штампи, стрічка з вкладками-папками ===== */
:root[data-style=label]{--bg:#D6DDE6;--card:#FFFFFF;--tx:#12263F;--mu:#566478;--bd:#C3CCD8;--ac:#1F5FBF;--ac2:#E3ECF9;--ok:#1B7F4B;--wr:#9A5B00;--er:#D9372B;--c:#1F5FBF;--m:#D9372B;--y:#FFD23F;--k:#12263F;--btn:#12263F;--btx:#FFFFFF;--kt:#12263F;--ktx:#FFFFFF;--hd:#12263F;color-scheme:light}
@media(prefers-color-scheme:dark){:root[data-style=label]:not([data-theme="light"]){--bg:#0F1319;--card:#1A212B;--tx:#E6ECF4;--mu:#98A5B8;--bd:#2B3544;--ac:#6FA8FF;--ac2:#1B2B45;--ok:#4FD08A;--wr:#FFC857;--er:#FF6B5B;--c:#6FA8FF;--m:#FF6B5B;--y:#FFD23F;--k:#E6ECF4;--btn:#FFD23F;--btx:#12263F;--kt:#0A0D12;--ktx:#FFFFFF;--hd:#05080D;color-scheme:dark}}
:root[data-style=label][data-theme="dark"]{--bg:#0F1319;--card:#1A212B;--tx:#E6ECF4;--mu:#98A5B8;--bd:#2B3544;--ac:#6FA8FF;--ac2:#1B2B45;--ok:#4FD08A;--wr:#FFC857;--er:#FF6B5B;--c:#6FA8FF;--m:#FF6B5B;--y:#FFD23F;--k:#E6ECF4;--btn:#FFD23F;--btx:#12263F;--kt:#0A0D12;--ktx:#FFFFFF;--hd:#05080D;color-scheme:dark}
:root[data-style=label] body{background-image:repeating-linear-gradient(45deg,transparent 0 11px,color-mix(in srgb,var(--tx) 5%,transparent) 11px 12px)}
:root[data-style=label] body::after{display:none}:root[data-style=label] .logo circle{mix-blend-mode:screen}:root[data-style=label] body::before{background:var(--hd)}
:root[data-style=label] header{background:var(--hd);border-bottom:0;color:#fff}:root[data-style=label] header::before{display:none}
:root[data-style=label] h1,:root[data-style=label] h1 #who{color:#fff}:root[data-style=label] h1 #who{opacity:.7}
:root[data-style=label] h1,:root[data-style=label] .kpi,:root[data-style=label] dialog h3{font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em}:root[data-style=label] h1{font-size:19px;font-weight:600}
:root[data-style=label] header>button{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}

:root[data-style=label] nav button.on{background:var(--bg);color:var(--tx)}
:root[data-style=label] .card{border:0;border-radius:14px;box-shadow:0 1px 0 rgba(18,38,63,.14),0 10px 20px -12px rgba(18,38,63,.45)}
:root[data-style=label] .grid>.card:not(.kt){position:relative;padding-top:30px}

:root[data-style=label] .kt .mu{color:var(--y);opacity:1}:root[data-style=label] .kt .kpi{font-size:clamp(30px,5.4vw,40px);font-weight:600}
:root[data-style=label] .card.tk{border:1px solid var(--bd);border-top:5px solid var(--tcol,var(--c));border-radius:10px;box-shadow:none;
-webkit-mask:radial-gradient(circle 8px at 0 55%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 55%,#0000 98%,#000) right/51% 100% no-repeat;
mask:radial-gradient(circle 8px at 0 55%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 55%,#0000 98%,#000) right/51% 100% no-repeat}
:root[data-style=label] .card.w0{--tcol:var(--c)}:root[data-style=label] .card.w1{--tcol:var(--m)}:root[data-style=label] .card.w2{--tcol:var(--k)}:root[data-style=label] .card.w3{--tcol:var(--y)}:root[data-style=label] .card.w4{--tcol:#7C5CFF}:root[data-style=label] .card.w5{--tcol:var(--mu)}
:root[data-style=label] .tag.o,:root[data-style=label] .tag.e{background:transparent;border:2px solid currentColor;font-weight:800;padding:0 8px;transform:rotate(-3deg);opacity:.92}:root[data-style=label] .tag.e{transform:rotate(2deg)}
:root[data-style=label] button.p:hover{box-shadow:3px 3px 0 var(--m)}:root[data-style=label] dialog{border-top:6px solid var(--y)}

/* ===== стиль «Креслення»: техкрес на кальці й синьці, кутові мітки, лінійка ===== */
:root[data-style=blueprint]{--bg:#E8F0F8;--card:#F8FBFE;--tx:#0B3A66;--mu:#4F6F8F;--bd:#9DB8D4;--ac:#0B6BCB;--ac2:#DCEBFA;--ok:#0E7C4A;--wr:#8A5A00;--er:#C62828;--c:#0B6BCB;--m:#E8590C;--y:#FFB020;--k:#0B3A66;--btn:#0B3A66;--btx:#FFFFFF;--kt:#0B3A66;--ktx:#FFFFFF;color-scheme:light}
@media(prefers-color-scheme:dark){:root[data-style=blueprint]:not([data-theme="light"]){--bg:#0A2F55;--card:#0D3B6B;--tx:#EAF4FF;--mu:#9FC2E6;--bd:#3E6FA3;--ac:#7CC4FF;--ac2:#124A82;--ok:#5EE0A0;--wr:#FFC857;--er:#FF8A80;--c:#7CC4FF;--m:#FF8A3D;--y:#FFC857;--k:#EAF4FF;--btn:#FFC857;--btx:#0A2F55;--kt:#0D3B6B;--ktx:#EAF4FF;color-scheme:dark}}
:root[data-style=blueprint][data-theme="dark"]{--bg:#0A2F55;--card:#0D3B6B;--tx:#EAF4FF;--mu:#9FC2E6;--bd:#3E6FA3;--ac:#7CC4FF;--ac2:#124A82;--ok:#5EE0A0;--wr:#FFC857;--er:#FF8A80;--c:#7CC4FF;--m:#FF8A3D;--y:#FFC857;--k:#EAF4FF;--btn:#FFC857;--btx:#0A2F55;--kt:#0D3B6B;--ktx:#EAF4FF;color-scheme:dark}
:root[data-style=blueprint] body{font-family:"IBM Plex Sans",Manrope,system-ui,sans-serif;background-image:linear-gradient(color-mix(in srgb,var(--tx) 16%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--tx) 16%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--tx) 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--tx) 7%,transparent) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px}
:root[data-style=blueprint] body::after{display:none}
:root[data-style=blueprint] header{border-bottom:2px solid var(--tx);padding-top:20px}
:root[data-style=blueprint] header::before{height:8px;background:repeating-linear-gradient(90deg,var(--tx) 0 1px,transparent 1px 8px);opacity:.6}
:root[data-style=blueprint] h1,:root[data-style=blueprint] .kpi,:root[data-style=blueprint] dialog h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:.01em}:root[data-style=blueprint] h1{font-size:19px}
:root[data-style=blueprint] nav button{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:15px}:root[data-style=blueprint] nav button.on{border-bottom-color:var(--y)}
:root[data-style=blueprint] .card{border:1.5px solid var(--tx);border-radius:2px;position:relative}
:root[data-style=blueprint] .card:not(.kt)::before,:root[data-style=blueprint] .card:not(.kt)::after{content:"";position:absolute;width:11px;height:11px;border:0 solid var(--y);pointer-events:none}
:root[data-style=blueprint] .card:not(.kt)::before{left:-3px;top:-3px;border-left-width:3px;border-top-width:3px}:root[data-style=blueprint] .card:not(.kt)::after{right:-3px;bottom:-3px;border-right-width:3px;border-bottom-width:3px}
:root[data-style=blueprint] .kt{background:var(--card);color:var(--tx);border:1.5px solid var(--tx);border-top-width:7px;padding:14px 16px}
:root[data-style=blueprint] .kt .mu{opacity:1;font-weight:600}:root[data-style=blueprint] .kt .kpi{font-size:clamp(30px,5.4vw,42px)}:root[data-style=blueprint] .kt .bar{background:var(--bd)}:root[data-style=blueprint] .kt .bar i{background:var(--tx)}
:root[data-style=blueprint] .k1{border-top-color:var(--c)}:root[data-style=blueprint] .k2{border-top-color:var(--m)}:root[data-style=blueprint] .k3{border-top-color:var(--y)}:root[data-style=blueprint] .k4{border-top-color:var(--ok)}
:root[data-style=blueprint] .card.w0,:root[data-style=blueprint] .card.w1,:root[data-style=blueprint] .card.w2,:root[data-style=blueprint] .card.w3,:root[data-style=blueprint] .card.w4,:root[data-style=blueprint] .card.w5{border-left-width:7px}
:root[data-style=blueprint] .card.w0{border-left-color:var(--c)}:root[data-style=blueprint] .card.w1{border-left-color:var(--m)}:root[data-style=blueprint] .card.w2{border-left-color:var(--k)}:root[data-style=blueprint] .card.w3{border-left-color:var(--y)}:root[data-style=blueprint] .card.w4{border-left-color:#7C5CFF}:root[data-style=blueprint] .card.w5{border-left-color:var(--mu)}
:root[data-style=blueprint] button,:root[data-style=blueprint] input,:root[data-style=blueprint] select,:root[data-style=blueprint] textarea{border-radius:2px;border:1.5px solid var(--tx)}:root[data-style=blueprint] nav button{border:0;border-bottom:3px solid transparent}
:root[data-style=blueprint] button.p{background:var(--btn);color:var(--btx);border-color:var(--btn)}:root[data-style=blueprint] button.p:hover{box-shadow:3px 3px 0 var(--m)}
:root[data-style=blueprint] .tag{border-radius:2px;background:transparent;border:1px solid currentColor}
:root[data-style=blueprint] dialog{border:2px solid var(--tx);border-radius:2px}

/* ===== стиль «Корпоративний»: бокове меню, хлібні крихти, тихі картки (за зразком внутрішньої системи) ===== */
.ph{display:none}
:root[data-style=ruta]{--bg:#F3F4F6;--card:#FFFFFF;--tx:#1F2430;--mu:#6B7280;--bd:#E7E9EE;--ac:#3B6FE8;--ac2:#E8EFFD;--ok:#2F8F46;--wr:#A86A00;--er:#DC2626;--c:#3B6FE8;--m:#E5484D;--y:#F5B301;--k:#111827;--btn:#111827;--btx:#FFFFFF;--kt:#111827;--ktx:#FFFFFF;--sel:#D9EDCC;color-scheme:light}
@media(prefers-color-scheme:dark){:root[data-style=ruta]:not([data-theme="light"]){--bg:#0F1115;--card:#171A21;--tx:#E8EAEE;--mu:#9AA1AE;--bd:#262B35;--ac:#7AA2FF;--ac2:#1B2540;--ok:#4ADE80;--wr:#FFC857;--er:#FF7A7A;--c:#7AA2FF;--m:#FF7A7A;--y:#FFC857;--k:#E8EAEE;--btn:#F3F4F6;--btx:#111827;--kt:#171A21;--ktx:#E8EAEE;--sel:#24402A;color-scheme:dark}}
:root[data-style=ruta][data-theme="dark"]{--bg:#0F1115;--card:#171A21;--tx:#E8EAEE;--mu:#9AA1AE;--bd:#262B35;--ac:#7AA2FF;--ac2:#1B2540;--ok:#4ADE80;--wr:#FFC857;--er:#FF7A7A;--c:#7AA2FF;--m:#FF7A7A;--y:#FFC857;--k:#E8EAEE;--btn:#F3F4F6;--btx:#111827;--kt:#171A21;--ktx:#E8EAEE;--sel:#24402A;color-scheme:dark}
:root[data-style=ruta] body{font-family:Inter,Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background-image:none}

<body>
<header>
<h1><svg class=logo viewBox="0 0 38 38" width=36 height=36 aria-hidden=true><circle class=c cx=14 cy=14 r=11></circle><circle class=m cx=24 cy=14 r=11></circle><circle class=y cx=19 cy=23 r=11></circle></svg><span>Облік принтерів<span id=who class=mu></span></span></h1>
<button id="bs" title="Стиль оформлення" aria-label="Стиль оформлення">🎨</button><button id="bn" title="Сповіщення" aria-label="Сповіщення">🔔</button><button id="bt" title="Тема" aria-label="Тема">🌓</button><button id="bo" title="Вийти" aria-label="Вийти">⎋</button>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,getDoc,addDoc,query,orderBy,limit,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const fapp=initializeApp({apiKey:"AIzaSyBSXlnZAat5SV_nvasmfE-yKbMPfXqTmno",authDomain:"printers2323.firebaseapp.com",projectId:"printers2323",storageBucket:"printers2323.firebasestorage.app",messagingSenderId:"766693292856",appId:"1:766693292856:web:01d5bd4d5a7c75f6641fcd"}),fdb=getFirestore(fapp),auth=getAuth(fapp);const PENDING_VIEW=false,USERS_CAN_DELETE=false;   // політика доступу: збігається з Code.gs і правилами Firestore
let ME=null,ST="load",ERR="",started=false,REG=null,NOPROF=false;const canEdit=()=>!!ME&&(ME.role==="admin"||ME.role==="user"),isAdmin=()=>!!ME&&ME.role==="admin";const ADMIN_UID="5fJgXkVcYyPqVqTObRS13Eoa0tt1";   // Firebase → Authentication → Users → User UID (той самий, що в firestore.rules)
const TYPES=["Заміна картриджа","Заправка","Ремонт","Чистка","Заміна барабана/фьюзера","Інше"];
const CART=["Заміна картриджа","Заправка"];
const S={printers:[],works:[],stock:[],meta:[]};let db=null,view="dash",F={per:"all",pr:"",ty:""},q="";
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0"),today=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())},nowStamp=()=>{const d=new Date();return today()+"T"+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds())+"."+String(d.getMilliseconds()).padStart(3,"0")},fmt=d=>d?String(d).slice(0,10).split("-").reverse().join("."):"—",fmtH=d=>esc(fmt(d)),num=v=>Number(v)||0,uah=v=>Math.round(v).toLocaleString("uk-UA")+" ₴";
const pname=p=>p?`${p.m} ${p.sn||""}`.trim()+(p.loc?` · ${p.loc}`:""):"(видалено)";
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const GS_URL="https://script.google.com/macros/s/AKfycbzW6vmgvGXZiw0EAQZVffXFXbJnJhg1o3MmXb2zrSJkfc43jUP4o2vSm-CtHngncN3-/exec";let pend=0,GSERR="",AUD=[];S.users=[];S.requests=[];
const idt=()=>auth.currentUser.getIdToken();
async function gsPost(d){pend++;try{const r=await fetch(GS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...d,t:await idt()})});const j=await r.json();if(j.error)throw new Error(j.error==="auth"?"немає доступу, увійдіть знову":j.error);return j}finally{pend--}}
let gsRetry=null;
async function gsLoad(){if(ST!=="ok")return;if(pend){if(!gsRetry)gsRetry=setTimeout(()=>{gsRetry=null;gsLoad()},500);return}if(ME.role==="pending"&&!PENDING_VIEW)return;if(!GS_URL.startsWith("http")){GSERR="У файлі не вказано адресу веб-застосунку (GS_URL).";render();return}
 try{const r=await fetch(GS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"read",t:await idt()})});const j=await r.json();if(j.error)throw new Error(j.error==="auth"?"немає доступу до таблиці":j.error);if(pend){if(!gsRetry)gsRetry=setTimeout(()=>{gsRetry=null;gsLoad()},500);return}S.printers=j.printers;S.stock=j.stock;GSERR="";render()}catch(e){GSERR="Немає зв'язку з таблицею: "+(e.message||e);render()}}
const STYLES=[["ruta","Корпоративний"],["print","Друк"],["label","Етикетка"],["blueprint","Креслення"]];
function applyStyle(n){if(!STYLES.some(x=>x[0]===n))n="ruta";document.documentElement.dataset.style=n;try{localStorage.setItem("pt_style",n)}catch(e){}const b=$("#bs");if(b){b.title="Стиль: "+STYLES.find(x=>x[0]===n)[1]+" (натисніть, щоб змінити)"}}
const logAct=(a,d)=>{if(!isAdmin())return;try{addDoc(collection(fdb,"audit"),{t:Date.now(),email:auth.currentUser.email,a,d:d||""}).catch(()=>{})}catch(e){}};
const normReq=d=>({...d,date:/^\d{4}-\d{2}-\d{2}$/.test(d.date)?d.date:"",ts:num(d.ts),cost:num(d.cost),partQty:num(d.partQty),type:String(d.type??""),fault:String(d.fault??""),partName:String(d.partName??""),pid:String(d.pid??""),by:String(d.by??""),byName:String(d.byName??""),note:String(d.note??""),status:["pending","approved","rejected"].includes(d.status)?d.status:"pending"});
const normWork=d=>({...d,date:/^\d{4}-\d{2}-\d{2}$/.test(d.date)?d.date:"",ts:num(d.ts),cost:num(d.cost),cnt:num(d.cnt),type:String(d.type??""),fault:String(d.fault??""),part:String(d.part??""),pid:String(d.pid??"")});
const invStart=()=>(S.meta.find(x=>x.id==="inv")||{}).start||"2000-01-01";
async function save(col,o,ex){const i=S[col].findIndex(x=>x.id===o.id),prev=i<0?null:S[col][i];if(i<0)S[col].push(o);else S[col][i]=o;render();
 try{if(col==="printers"){await gsPost({op:"printer",p:o});logAct("Принтер: збережено",(o.m+" "+o.sn).trim())}
  else if(col==="stock"){await gsPost({op:"stock",name:o.name,old:(ex&&ex.old)||o.name,qty:o.qty});logAct("Склад: змінено",o.name+" → "+o.qty)}
  else{await setDoc(doc(fdb,col,o.id),JSON.parse(JSON.stringify(o)));if(col==="meta")logAct("Подія","Почато нову інвентаризацію");
   if(col==="works")logAct(i<0?"Робота: додано":"Робота: змінено",o.type+" — "+pname(S.printers.find(p=>p.id===o.pid))+(o.cost?" ("+o.cost+" ₴)":""));
   if(col==="works")gsPost({op:i<0?"work":"workEdit",w:{...o,printer:pname(S.printers.find(p=>p.id===o.pid))}}).catch(e=>alert("У таблицю журнал не записано: "+e.message))}}
 catch(e){alert("Не вдалося зберегти: "+(e.message||e.code));if(col==="works"||col==="meta"){const k=S[col].indexOf(o);if(prev&&k>=0)S[col][k]=prev;else S[col]=S[col].filter(x=>x!==o);render()}}if(col!=="works"&&col!=="meta")gsLoad()}
async function del(col,id){const it=S[col].find(x=>x.id===id);S[col]=S[col].filter(x=>x.id!==id);render();
 try{if(col==="printers"){await gsPost({op:"delPrinter",id});logAct("Принтер: видалено",it?(it.m+" "+it.sn).trim():id)}else if(col==="stock"){await gsPost({op:"delStock",name:it?it.name:id});logAct("Склад: видалено",it?it.name:id)}else{await deleteDoc(doc(fdb,col,id));logAct("Журнал: запис видалено","");if(col==="works")gsPost({op:"delWork",id}).catch(()=>{})}}
 catch(e){alert("Не вдалося видалити: "+(e.message||e.code));if(col==="works"&&it){S.works.push(it);render()}}if(col==="printers"||col==="stock")gsLoad()}

// --- прогноз ---
let LCM=null;
function lastCart(id){if(!LCM){LCM={};for(const w of S.works){if(!CART.includes(w.type))continue;const c=LCM[w.pid];if(!c||String(w.date).localeCompare(String(c.date))>0||(w.date===c.date&&num(w.ts)>num(c.ts)))LCM[w.pid]=w}}return LCM[id]}
function forecast(p){const lc=lastCart(p.id),res=num(p.res)||(p.ct==="тонер"?2000:4500),ld=num(p.load);
 if(!lc||!lc.cnt||!p.cnt||!ld)return{ok:false,res};const used=Math.max(0,num(p.cnt)-num(lc.cnt)),left=res-used,days=Math.round(left/(ld/30));
 return{ok:true,res,used,left,days,pct:Math.min(100,Math.round(used/res*100)),date:new Date(Date.now()+days*864e5).toISOString().slice(0,10)}}
function alerts(){const a=[];S.printers.forEach(p=>{const f=forecast(p);
 if(f.ok&&f.days<=14)a.push({k:"c"+p.id,t:f.left<=0?"e":"w",x:`${pname(p)}: ${f.left<=0?"картридж, ймовірно, вичерпано":"залишилось ~"+f.days+" дн. до заміни"}`});
 const lw=S.works.filter(w=>w.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
 if(lw&&(Date.now()-new Date(lw.date))/864e5>180)a.push({k:"o"+p.id,t:"w",x:`${pname(p)}: не обслуговувався понад 180 днів`})});
 S.stock.forEach(s=>{if(num(s.qty)<=num(s.min??1))a.push({k:"s"+s.id,t:num(s.qty)<=0?"e":"w",x:`Склад: «${s.name}» — залишок ${s.qty}`})});return a}
function notify(){if(!("Notification"in window)||Notification.permission!=="granted")return;let sent={};try{sent=JSON.parse(localStorage.getItem("pt_sent")||"{}")}catch(e){}
 alerts().forEach(a=>{if(sent[a.k]===today())return;sent[a.k]=today();try{new Notification("Облік принтерів",{body:a.x})}catch(e){}});try{localStorage.setItem("pt_sent",JSON.stringify(sent))}catch(e){}}

// --- фільтри/статистика ---
function fw(){const lim=F.per==="all"?null:new Date(Date.now()-num(F.per)*864e5).toISOString().slice(0,10);
 return S.works.filter(w=>(!lim||w.date>=lim)&&(!F.pr||w.pid===F.pr)&&(!F.ty||w.type===F.ty))}
function bars(data,w=520,h=150,col="var(--ac)",suf=""){if(!data.length)return"<p class=mu>Немає даних</p>";const mx=Math.max(1,...data.map(d=>d[1])),bw=(w-20)/data.length;
 return`<div class=ch><svg viewBox="0 0 ${w} ${h+24}" width="100%" style="min-width:${Math.min(w,data.length*38)}px">${data.map((d,i)=>{const bh=d[1]/mx*h;return`<rect x="${10+i*bw+3}" y="${h-bh+8}" width="${Math.max(4,bw-6)}" height="${bh}" rx="3" fill="${col}"/><text x="${10+i*bw+bw/2}" y="${h-bh+3}" text-anchor="middle">${Math.round(d[1])}${suf}</text><text x="${10+i*bw+bw/2}" y="${h+22}" text-anchor="middle">${esc(d[0])}</text>`}).join("")}</svg></div>`}
function hbars(data){const mx=Math.max(1,...data.map(d=>d[1]));return data.length?data.map(d=>`<div style="margin:6px 0"><div class=row style="justify-content:space-between;flex-wrap:nowrap"><span>${esc(d[0])}</span><b style="flex:0">${d[1]}</b></div><div class=bar><i style="width:${d[1]/mx*100}%"></i></div></div>`).join(""):"<p class=mu>Немає даних</p>"}
function donut(data){const t=data.reduce((a,d)=>a+d[1],0);if(!t)return"<p class=mu>Немає даних</p>";const C=["#2563eb","#16a34a","#d97706","#dc2626","#7c3aed","#0891b2"];let off=0;
 const R=40,L=2*Math.PI*R;return`<div class=row style="flex-wrap:nowrap"><svg viewBox="0 0 100 100" width="130" style="flex:0 0 130px;transform:rotate(-90deg)">${data.map((d,i)=>{const s=d[1]/t*L,e=`<circle cx=50 cy=50 r=${R} fill=none stroke="${C[i%6]}" stroke-width=18 stroke-dasharray="${s} ${L-s}" stroke-dashoffset="${-off}"/>`;off+=s;return e}).join("")}</svg><div>${data.map((d,i)=>`<div><span style="color:${C[i%6]}">●</span> ${esc(d[0])}: <b>${d[1]}</b></div>`).join("")}</div></div>`}
function byMonth(ws,fn){const m={};ws.forEach(w=>{const k=w.date.slice(0,7);m[k]=(m[k]||0)+fn(w)});return Object.keys(m).sort().slice(-12).map(k=>[k.slice(5)+"."+k.slice(2,4),m[k]])}

// --- відображення ---
function filt(){return`<div class="card row"><div><label>Період</label><select data-f=per>${[["all","Весь час"],["30","30 днів"],["90","90 днів"],["365","Рік"]].map(o=>`<option value=${o[0]} ${F.per===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div><div><label>Принтер</label><select data-f=pr><option value="">Усі</option>${S.printers.map(p=>`<option value="${esc(p.id)}" ${F.pr===p.id?"selected":""}>${esc(pname(p))}</option>`).join("")}</select></div><div><label>Тип роботи</label><select data-f=ty><option value="">Усі</option>${TYPES.map(t=>`<option ${F.ty===t?"selected":""}>${t}</option>`).join("")}</select></div></div>`}
const V={
dash(){const ws=fw(),al=alerts(),cost=ws.reduce((a,w)=>a+num(w.cost),0),inv=S.meta.find(x=>x.id==="inv"),st=inv?.start||"2000-01-01",done=S.printers.filter(p=>p.inv&&p.inv>=st).length;
 const ty={};ws.forEach(w=>ty[w.type]=(ty[w.type]||0)+1);const pr={};ws.forEach(w=>pr[w.pid]=(pr[w.pid]||0)+1);
 return filt()+`<div class="grid kg"><div class="card kt k1"><div class=mu>Виконано робіт</div><div class=kpi>${ws.length}</div></div><div class="card kt k2"><div class=mu>Витрати</div><div class=kpi>${uah(cost)}</div></div><div class="card kt k3"><div class=mu>Середня вартість</div><div class=kpi>${ws.length?uah(cost/ws.length):"—"}</div></div>${isAdmin()?`<div class="card kt k4"><div class=mu>Інвентаризація</div><div class=kpi>${done}/${S.printers.length}</div><div class=bar><i style="width:${S.printers.length?done/S.printers.length*100:0}%"></i></div></div>`:""}</div>
 <div class=card><b>⚠️ Сповіщення (${al.length})</b>${al.length?al.map(a=>`<div><span class="tag ${a.t}">${a.t==="e"?"терміново":"увага"}</span> ${esc(a.x)}</div>`).join(""):"<p class=mu>Усе гаразд 👍</p>"}</div>
 <div class=card><b>Витрати по місяцях</b>${bars(byMonth(ws,w=>num(w.cost)),520,150,"var(--m)","₴")}</div>
