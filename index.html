<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облік принтерів</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--bd:#e2e5ea;--ac:#2563eb;--ac2:#dbeafe;--ok:#16a34a;--wr:#d97706;--er:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161a;--card:#1c2026;--tx:#e8eaee;--mu:#9099a6;--bd:#2c323a;--ac:#5b8def;--ac2:#1e2a44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161a;--card:#1c2026;--tx:#e8eaee;--mu:#9099a6;--bd:#2c323a;--ac:#5b8def;--ac2:#1e2a44;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1;min-width:140px}
nav{display:flex;gap:4px;overflow-x:auto;width:100%}
nav button{flex:1;min-width:max-content}
main{max-width:1000px;margin:0 auto;padding:14px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 13px;cursor:pointer;min-height:40px}
button.p,nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--er)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;min-height:40px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kpi{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin:2px 2px 0 0}
.tag.w{background:#fef3c7;color:var(--wr)}.tag.e{background:#fee2e2;color:var(--er)}.tag.o{background:#dcfce7;color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:16px}
dialog::backdrop{background:#0008}
.ch{overflow-x:auto}svg text{fill:var(--mu);font-size:11px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🖨️ Облік принтерів <span id=who class=mu style="font-weight:400;font-size:12px"></span></h1>
<button id="bn" title="Сповіщення">🔔</button><button id="bt" title="Тема">🌓</button><button id="bo" title="Вийти">⎋</button>
<nav id="nav"></nav>
</header>
<main id="m"></main>
<dialog id="dg"></dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,getDoc,addDoc,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const fapp=initializeApp({apiKey:"AIzaSyBSXlnZAat5SV_nvasmfE-yKbMPfXqTmno",authDomain:"printers2323.firebaseapp.com",projectId:"printers2323",storageBucket:"printers2323.firebasestorage.app",messagingSenderId:"766693292856",appId:"1:766693292856:web:01d5bd4d5a7c75f6641fcd"}),fdb=getFirestore(fapp),auth=getAuth(fapp);let ME=null,ST="load",ERR="",started=false,REG=null,NOPROF=false;const canEdit=()=>!!ME&&(ME.role==="admin"||ME.role==="user");const ADMIN_EMAIL="slavik2002@gmail.com";
const TYPES=["Заміна картриджа","Заправка","Ремонт","Чистка","Заміна барабана/фьюзера","Інше"];
const CART=["Заміна картриджа","Заправка"];
const S={printers:[],works:[],stock:[],meta:[]};let db=null,view="dash",F={per:"all",pr:"",ty:""},q="";
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10),fmt=d=>d?d.split("-").reverse().join("."):"—",num=v=>Number(v)||0,uah=v=>Math.round(v).toLocaleString("uk-UA")+" ₴";
const pname=p=>p?`${p.m} ${p.sn||""}`.trim()+(p.loc?` · ${p.loc}`:""):"(видалено)";
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const GS_URL="https://script.google.com/macros/s/AKfycbzW6vmgvGXZiw0EAQZVffXFXbJnJhg1o3MmXb2zrSJkfc43jUP4o2vSm-CtHngncN3-/exec";let pend=0,GSERR="",AUD=[];S.users=[];
const idt=()=>auth.currentUser.getIdToken();
async function gsPost(d){pend++;try{const r=await fetch(GS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...d,t:await idt()})});const j=await r.json();if(j.error)throw new Error(j.error==="auth"?"немає доступу, увійдіть знову":j.error);return j}finally{pend--}}
async function gsLoad(){if(pend||ST!=="ok")return;if(!GS_URL.startsWith("http")){GSERR="У файлі не вказано адресу веб-застосунку (GS_URL).";render();return}
 try{const r=await fetch(GS_URL+"?t="+encodeURIComponent(await idt()));const j=await r.json();if(j.error)throw new Error(j.error==="auth"?"немає доступу до таблиці":j.error);if(pend)return;S.printers=j.printers;S.stock=j.stock;GSERR="";render()}catch(e){GSERR="Немає зв'язку з таблицею: "+(e.message||e);render()}}
const logAct=(a,d)=>{try{addDoc(collection(fdb,"audit"),{t:Date.now(),email:auth.currentUser.email,a,d:d||""}).catch(()=>{})}catch(e){}};
async function save(col,o){const i=S[col].findIndex(x=>x.id===o.id);if(i<0)S[col].push(o);else S[col][i]=o;render();
 try{if(col==="printers"){await gsPost({op:"printer",p:o});logAct("Принтер: збережено",(o.m+" "+o.sn).trim())}
  else if(col==="stock"){await gsPost({op:"stock",name:o.name,old:o._old||o.name,qty:o.qty});logAct("Склад: змінено",o.name+" → "+o.qty)}
  else{await setDoc(doc(fdb,col,o.id),JSON.parse(JSON.stringify(o)));if(col==="meta")logAct("Подія","Почато нову інвентаризацію");
   if(col==="works")logAct("Робота: додано",o.type+" — "+pname(S.printers.find(p=>p.id===o.pid))+(o.cost?" ("+o.cost+" ₴)":""));
   if(col==="works")gsPost({op:"work",w:{...o,printer:pname(S.printers.find(p=>p.id===o.pid))}}).catch(e=>alert("У таблицю журнал не записано: "+e.message))}}
 catch(e){alert("Не вдалося зберегти: "+(e.message||e.code))}if(col!=="works"&&col!=="meta")gsLoad()}
async function del(col,id){const it=S[col].find(x=>x.id===id);S[col]=S[col].filter(x=>x.id!==id);render();
 try{if(col==="printers"){await gsPost({op:"delPrinter",id});logAct("Принтер: видалено",it?(it.m+" "+it.sn).trim():id)}else if(col==="stock"){await gsPost({op:"delStock",name:it?it.name:id});logAct("Склад: видалено",it?it.name:id)}else{await deleteDoc(doc(fdb,col,id));logAct("Журнал: запис видалено","")}}
 catch(e){alert("Не вдалося видалити: "+(e.message||e.code))}if(col==="printers"||col==="stock")gsLoad()}

// --- прогноз ---
function lastCart(id){return S.works.filter(w=>w.pid===id&&CART.includes(w.type)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts)[0]}
function forecast(p){const lc=lastCart(p.id),res=num(p.res)||(p.ct==="тонер"?2000:4500),ld=num(p.load);
 if(!lc||!lc.cnt||!p.cnt||!ld)return{ok:false,res};const used=Math.max(0,num(p.cnt)-num(lc.cnt)),left=res-used,days=Math.round(left/(ld/30));
 return{ok:true,res,used,left,days,pct:Math.min(100,Math.round(used/res*100)),date:new Date(Date.now()+days*864e5).toISOString().slice(0,10)}}
function alerts(){const a=[];S.printers.forEach(p=>{const f=forecast(p);
 if(f.ok&&f.days<=14)a.push({k:"c"+p.id,t:f.left<=0?"e":"w",x:`${pname(p)}: ${f.left<=0?"картридж, ймовірно, вичерпано":"залишилось ~"+f.days+" дн. до заміни"}`});
 const lw=S.works.filter(w=>w.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
 if(lw&&(Date.now()-new Date(lw.date))/864e5>180)a.push({k:"o"+p.id,t:"w",x:`${pname(p)}: не обслуговувався понад 180 днів`})});
 S.stock.forEach(s=>{if(num(s.qty)<=num(s.min??1))a.push({k:"s"+s.id,t:num(s.qty)<=0?"e":"w",x:`Склад: «${s.name}» — залишок ${s.qty}`})});return a}
function notify(){if(!("Notification"in window)||Notification.permission!=="granted")return;let sent={};try{sent=JSON.parse(localStorage.getItem("pt_sent")||"{}")}catch(e){}
 alerts().forEach(a=>{if(sent[a.k]===today())return;sent[a.k]=today();try{new Notification("Облік принтерів",{body:a.x})}catch(e){}});try{localStorage.setItem("pt_sent",JSON.stringify(sent))}catch(e){}}

// --- фільтри/статистика ---
function fw(){const lim=F.per==="all"?null:new Date(Date.now()-num(F.per)*864e5).toISOString().slice(0,10);
 return S.works.filter(w=>(!lim||w.date>=lim)&&(!F.pr||w.pid===F.pr)&&(!F.ty||w.type===F.ty))}
function bars(data,w=520,h=150,col="var(--ac)",suf=""){if(!data.length)return"<p class=mu>Немає даних</p>";const mx=Math.max(1,...data.map(d=>d[1])),bw=(w-20)/data.length;
 return`<div class=ch><svg viewBox="0 0 ${w} ${h+24}" width="100%" style="min-width:${Math.min(w,data.length*38)}px">${data.map((d,i)=>{const bh=d[1]/mx*h;return`<rect x="${10+i*bw+3}" y="${h-bh+8}" width="${Math.max(4,bw-6)}" height="${bh}" rx="3" fill="${col}"/><text x="${10+i*bw+bw/2}" y="${h-bh+3}" text-anchor="middle">${Math.round(d[1])}${suf}</text><text x="${10+i*bw+bw/2}" y="${h+22}" text-anchor="middle">${esc(d[0])}</text>`}).join("")}</svg></div>`}
function hbars(data){const mx=Math.max(1,...data.map(d=>d[1]));return data.length?data.map(d=>`<div style="margin:6px 0"><div class=row style="justify-content:space-between;flex-wrap:nowrap"><span>${esc(d[0])}</span><b style="flex:0">${d[1]}</b></div><div class=bar><i style="width:${d[1]/mx*100}%"></i></div></div>`).join(""):"<p class=mu>Немає даних</p>"}
function donut(data){const t=data.reduce((a,d)=>a+d[1],0);if(!t)return"<p class=mu>Немає даних</p>";const C=["#2563eb","#16a34a","#d97706","#dc2626","#7c3aed","#0891b2"];let off=0;
 const R=40,L=2*Math.PI*R;return`<div class=row style="flex-wrap:nowrap"><svg viewBox="0 0 100 100" width="130" style="flex:0 0 130px;transform:rotate(-90deg)">${data.map((d,i)=>{const s=d[1]/t*L,e=`<circle cx=50 cy=50 r=${R} fill=none stroke="${C[i%6]}" stroke-width=18 stroke-dasharray="${s} ${L-s}" stroke-dashoffset="${-off}"/>`;off+=s;return e}).join("")}</svg><div>${data.map((d,i)=>`<div><span style="color:${C[i%6]}">●</span> ${esc(d[0])}: <b>${d[1]}</b></div>`).join("")}</div></div>`}
function byMonth(ws,fn){const m={};ws.forEach(w=>{const k=w.date.slice(0,7);m[k]=(m[k]||0)+fn(w)});return Object.keys(m).sort().slice(-12).map(k=>[k.slice(5)+"."+k.slice(2,4),m[k]])}

// --- відображення ---
function filt(){return`<div class="card row"><div><label>Період</label><select data-f=per>${[["all","Весь час"],["30","30 днів"],["90","90 днів"],["365","Рік"]].map(o=>`<option value=${o[0]} ${F.per===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div><div><label>Принтер</label><select data-f=pr><option value="">Усі</option>${S.printers.map(p=>`<option value="${esc(p.id)}" ${F.pr===p.id?"selected":""}>${esc(pname(p))}</option>`).join("")}</select></div><div><label>Тип роботи</label><select data-f=ty><option value="">Усі</option>${TYPES.map(t=>`<option ${F.ty===t?"selected":""}>${t}</option>`).join("")}</select></div></div>`}
const V={
dash(){const ws=fw(),al=alerts(),cost=ws.reduce((a,w)=>a+num(w.cost),0),inv=S.meta.find(x=>x.id==="inv"),st=inv?.start||"2000-01-01",done=S.printers.filter(p=>p.inv&&p.inv>=st).length;
 const ty={};ws.forEach(w=>ty[w.type]=(ty[w.type]||0)+1);const pr={};ws.forEach(w=>pr[w.pid]=(pr[w.pid]||0)+1);
 return filt()+`<div class=grid><div class=card><div class=mu>Виконано робіт</div><div class=kpi>${ws.length}</div></div><div class=card><div class=mu>Витрати</div><div class=kpi>${uah(cost)}</div></div><div class=card><div class=mu>Середня вартість</div><div class=kpi>${ws.length?uah(cost/ws.length):"—"}</div></div><div class=card><div class=mu>Інвентаризація</div><div class=kpi>${done}/${S.printers.length}</div><div class=bar><i style="width:${S.printers.length?done/S.printers.length*100:0}%"></i></div></div></div>
 <div class=card><b>⚠️ Сповіщення (${al.length})</b>${al.length?al.map(a=>`<div><span class="tag ${a.t}">${a.t==="e"?"терміново":"увага"}</span> ${esc(a.x)}</div>`).join(""):"<p class=mu>Усе гаразд 👍</p>"}</div>
 <div class=card><b>Витрати по місяцях</b>${bars(byMonth(ws,w=>num(w.cost)),520,150,"var(--ok)","₴")}</div>
 <div class=grid><div class=card><b>Топ принтерів за зверненнями</b>${hbars(Object.entries(pr).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>[pname(S.printers.find(p=>p.id===k)),v]))}</div></div>`},
printers(){const l=S.printers.filter(p=>(pname(p)+p.ip+p.orig+p.desc).toLowerCase().includes(q.toLowerCase())),inv=S.meta.find(x=>x.id==="inv"),st=inv?.start||"2000-01-01";
 return`<div class=row><input id=q placeholder="Пошук: модель, місце, IP…" value="${esc(q)}"><button data-a=scan style="flex:0;min-width:max-content">📷 Сканувати</button><button class=p data-a=addp style="flex:0">＋ Принтер</button><button data-a=newinv style="flex:0;min-width:max-content">Нова інвентаризація</button></div><p class=mu>Знайдено: ${l.length}. Кнопка ✔ позначає принтер як звірений під час інвентаризації.</p>
 ${!S.printers.length?"<p class=mu>Завантаження з таблиці…</p>":""}
 <div class=grid>${l.map(p=>{const f=forecast(p),ok=p.inv&&p.inv>=st;return`<div class=card><b>${esc(p.m)} ${esc(p.sn)}</b><div class=mu>${esc(p.loc||"без місця")} · ${esc(p.fmt)} · ${esc(p.ct)}${p.ip?" · "+esc(p.ip):""}</div><div class=mu>Картридж: ${esc(p.orig||"—")}${p.rep?" / "+esc(p.rep):""}</div>
 <div style="margin:6px 0">${ok?`<span class="tag o">✔ звірено ${fmt(p.inv)}</span>`:`<span class="tag w">не звірено</span>`}${f.ok?`<span class="tag ${f.days<=14?"e":""}">~${f.days} дн. до заміни</span>`:`<span class=tag>прогноз: потрібні дані</span>`}</div>
 ${f.ok?`<div class=bar><i style="width:${f.pct}%"></i></div><div class=mu>Ресурс ${f.pct}% · орієнт. ${fmt(f.date)}</div>`:""}
 <div class=row style="margin-top:8px"><button data-a=work data-id="${esc(p.id)}" class=p>＋ Робота</button><button data-a=chk data-id="${esc(p.id)}">✔</button><button data-a=qr data-id="${esc(p.id)}">QR</button><button data-a=editp data-id="${esc(p.id)}">✎</button></div></div>`}).join("")}</div>`},
journal(){const ws=fw().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);return filt()+`<div class=row><button class=p data-a=work style="flex:0;min-width:max-content">＋ Нова робота</button><button data-a=csv style="flex:0;min-width:max-content">⬇ CSV для бухгалтерії</button></div><div style="margin-top:10px">${ws.length?ws.map(w=>`<div class=card><div class=row style="justify-content:space-between;flex-wrap:nowrap"><b>${fmt(w.date)} · ${esc(w.type)}</b><b style="flex:0;white-space:nowrap">${w.cost?uah(num(w.cost)):""}</b></div><div class=mu>${esc(pname(S.printers.find(p=>p.id===w.pid)))}</div>${w.fault?`<div>🔧 Несправність: ${esc(w.fault)}</div>`:""}${w.done?`<div>✅ ${esc(w.done)}</div>`:""}<div class=mu>${w.cnt?"Лічильник: "+esc(w.cnt)+" · ":""}${w.part?"Витрачено зі складу: "+esc(w.part):""}</div><button data-a=delw data-id="${esc(w.id)}" class=d>Видалити</button></div>`).join(""):"<p class=mu>Записів немає.</p>"}</div>`},
stock(){return`<div class=row><button class=p data-a=adds style="flex:0;min-width:max-content">＋ Матеріал</button></div><div class=card style="margin-top:10px"><table><tr><th>Назва</th><th>К-сть</th><th>Мін.</th><th></th></tr>${S.stock.sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr><td>${esc(s.name)}${num(s.qty)<=num(s.min??1)?' <span class="tag e">мало</span>':""}</td><td><b>${s.qty}</b></td><td>${s.min??1}</td><td><button data-a=edits data-id="${esc(s.id)}">✎</button></td></tr>`).join("")}</table></div>`}};

V.admin=()=>`<div class=card><div class=row style="justify-content:space-between;flex-wrap:nowrap"><b>Користувачі</b><button class=p data-a=adduser style="flex:0;min-width:max-content">＋ Додати</button></div><table>${S.users.map(u=>`<tr><td>${esc(u.name)}<div class=mu>${esc(u.email)}</div></td><td>${u.role==="admin"?"адмін":u.role==="pending"?'<span class="tag w">очікує</span>':"користувач"}</td><td>${u.active?'<span class="tag o">активний</span>':'<span class="tag e">вимкнений</span>'}</td><td style="white-space:nowrap">${u.role==="pending"&&u.active?`<button class=p data-a=apr data-id="${esc(u.id)}">✔ Схвалити</button> `:""}${u.id===ME.uid?"":`<button data-a=tgl data-id="${esc(u.id)}">${u.active?"⏸":"▶"}</button> <button class=d data-a=delu data-id="${esc(u.id)}" title="Видалити">🗑</button> `}<button data-a=rst data-id="${esc(u.id)}" title="Скинути пароль">🔑</button></td></tr>`).join("")}</table></div>
<div class=card><div class=row style="justify-content:space-between;flex-wrap:nowrap"><b>Хто що редагував</b></div><div class=ch><table>${AUD.length?AUD.map(r=>`<tr><td style="white-space:nowrap">${esc(r.t)}</td><td>${esc(r.u)}</td><td>${esc(r.a)}</td><td>${esc(r.d)}</td></tr>`).join(""):"<tr><td class=mu>Записів ще немає</td></tr>"}</table></div></div>`;
let SC=null;
function stopScan(){if(SC){SC.run=false;try{SC.st.getTracks().forEach(t=>t.stop())}catch(e){}SC=null}}
async function scan(){dlg(`<h3>Сканування QR</h3><video id=sv playsinline muted style="width:100%;border-radius:10px;background:#000"></video><p id=ss class=mu>Наведіть камеру на наклейку принтера</p><div class=row><button data-a=sx>Закрити</button></div>`);
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}),v=$("#sv");v.srcObject=st;await v.play();SC={st,run:true};
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});let last="",lt=0,n=0;
  const tick=()=>{if(!SC||!SC.run)return;if(v.videoWidth&&++n%3===0){const w=Math.min(640,v.videoWidth);cv.width=w;cv.height=Math.round(v.videoHeight*w/v.videoWidth);cx.drawImage(v,0,0,cv.width,cv.height);
   const im=cx.getImageData(0,0,cv.width,cv.height),r=window.jsQR&&jsQR(im.data,im.width,im.height);
   if(r){const m=r.data.match(/#p=(\w+)/);if(m&&(m[1]!==last||Date.now()-lt>4000)){last=m[1];lt=Date.now();const p=S.printers.find(x=>x.id===m[1]),el=$("#ss");if(el){if(p){p.inv=today();save("printers",p);el.textContent="✔ Звірено: "+pname(p)}else el.textContent="Цього принтера немає в базі"}}}}
   requestAnimationFrame(tick)};tick()}catch(e){const el=$("#ss");if(el)el.textContent="Камера недоступна: "+(e.message||e)}}
function parsePrice(t){const key=/(разом|всього|сума|до сплати|итого|total|sum)/i,c=[];
 t.replace(/,/g,".").split(/\n/).forEach(l=>{const m=l.replace(/(\d)\s(\d{3})/g,"$1$2").match(/\d+\.\d{2}/g);if(m)m.forEach(x=>c.push({v:parseFloat(x),k:key.test(l)}))});
 const k=c.filter(x=>x.k),p=k.length?k:c;return p.length?Math.max(...p.map(x=>x.v)):0}
async function ocrCost(file){const st=$("#rs");st.textContent="Розпізнаю чек… (перший раз може бути довго)";
 try{if(!window.Tesseract)await new Promise((ok,no)=>{const e=document.createElement("script");e.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  const r=await Tesseract.recognize(file,"ukr+eng"),v=parsePrice(r.data.text);
  if(v){$("#w6").value=v;st.textContent="Знайдено суму "+v+" ₴. Перевірте, чи вірно."}else st.textContent="Суму не знайдено, введіть вручну."}catch(e){st.textContent="Не вдалося розпізнати: "+(e.message||e)}}
function render(){if(ST!=="ok"){$("#nav").innerHTML="";$("#who").textContent="";

 $("#m").innerHTML=ST==="load"?`<p class=mu style="text-align:center;margin-top:40px">Завантаження…</p>`
 :ST==="register"?box(`<h3>Реєстрація</h3><p class=mu>Після реєстрації ви зможете лише переглядати дані, доки адміністратор не схвалить доступ.</p>${fld("Ім'я","rn")}${fld("Email","re","","email")}${fld("Пароль (від 6 символів)","rp","","password")}<div class=row style="margin-top:12px"><button class=p data-a=register>Зареєструватися</button><button data-a=tologin>Назад</button></div>`)

 :box(`<h3>Вхід</h3>${fld("Email","le","","email")}${fld("Пароль","lp","","password")}<div class=row style="margin-top:12px"><button class=p data-a=login>Увійти</button><button data-a=regform>Реєстрація</button></div>`);return}
 $("#who").textContent=ME.name||ME.email;
 const t=[["dash","📊 Статистика"],["printers","🖨️ Принтери"],["journal","📝 Журнал"],["stock","📦 Склад"]].concat(ME.role==="admin"?[["admin","👤 Адмін"+(S.users.filter(u=>u.role==="pending"&&u.active).length?" ("+S.users.filter(u=>u.role==="pending"&&u.active).length+")":"")]]:[]);
 $("#nav").innerHTML=t.map(x=>`<button data-v=${x[0]} class="${view===x[0]?"on":""}">${x[1]}</button>`).join("");
 const keep=document.activeElement?.id==="q";$("#m").innerHTML=(ME.role==="pending"?`<div class=card style="border-color:var(--wr)">⏳ Ваш доступ очікує схвалення адміністратора. Поки що можна лише переглядати.</div>`:"")+(GSERR?`<div class=card style="border-color:var(--er)">⚠️ ${esc(GSERR)}</div>`:"")+V[view]();if(keep){const e=$("#q");e.focus();e.setSelectionRange(99,99)}}

function formW(pid=""){const sk=[["","— нічого —"],...S.stock.map(s=>[s.id,`${s.name} (${s.qty})`])];

document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,id=b.dataset.id,d=$("#dg");
 if(b.dataset.v){view=b.dataset.v;render();return}
 if(b.id==="bt"){const r=document.documentElement,dk=getComputedStyle(r).colorScheme==="dark";r.dataset.theme=dk?"light":"dark";try{localStorage.setItem("pt_th",r.dataset.theme)}catch(x){}return}
 if(b.id==="bo"){signOut(auth).then(()=>location.reload());return}
 if(b.id==="bn"){if(!("Notification"in window))return alert("Браузер не підтримує сповіщення");const r=await Notification.requestPermission();alert(r==="granted"?"Сповіщення увімкнено. Вони приходять, поки сторінка відкрита у браузері.":"Сповіщення не дозволено");notify();return}
 if(!a)return;
 if(["addp","editp","savep","delp","work","savew","delw","chk","newinv","adds","edits","saves","dels","scan"].includes(a)&&!canEdit()){alert("Редагування доступне після схвалення адміністратором.");return}
 if(a==="login"){signInWithEmailAndPassword(auth,val("le"),val("lp")).catch(()=>alert("Невірний email або пароль"));return}
 if(a==="x")d.close();
 else if(a==="regform"){ST="register";render()}
 else if(a==="tologin"){ST="login";render()}
 else if(a==="register"){const nm=val("rn"),em=val("re"),pw=val("rp");if(!nm||!em||pw.length<6)return alert("Вкажіть ім'я, email і пароль від 6 символів");REG={name:nm.slice(0,60)};
  try{await createUserWithEmailAndPassword(auth,em,pw)}catch(x){REG=null;alert(x.code==="auth/email-already-in-use"?"Такий email уже зареєстровано. Спробуйте увійти.":"Помилка: "+(x.code||x.message))}}
 else if(a==="req"){try{const u=auth.currentUser;await setDoc(doc(fdb,"users",u.uid),{email:u.email,name:(u.email||"").slice(0,60),role:"pending",active:true});location.reload()}catch(x){alert("Помилка: "+(x.code||x.message))}}
 else if(a==="apr"){const u=S.users.find(x=>x.id===id);if(u){await setDoc(doc(fdb,"users",id),{role:"user"},{merge:true});logAct("Подія","Схвалено доступ: "+u.email)}}
 else if(a==="delu"){const u=S.users.find(x=>x.id===id);if(u&&id!==ME.uid&&confirm("Видалити користувача "+u.email+"? Він втратить доступ.")){try{await deleteDoc(doc(fdb,"users",id));logAct("Подія","Видалено користувача "+u.email)}catch(x){alert("Помилка: "+(x.code||x.message))}}}
 else if(a==="sx"){stopScan();d.close()}
 else if(a==="scan")scan();

 else if(a==="adduser")dlg(`<h3>Новий користувач</h3>${fld("Ім'я","u1")}${fld("Email","u2","","email")}${fld("Пароль (від 6 символів)","u3")}${sel("Роль","u4",[["user","Користувач"],["admin","Адміністратор"]],"user")}<div class=row style="margin-top:12px"><button class=p data-a=saveuser>Створити</button><button data-a=x>Скасувати</button></div>`)
 else if(a==="saveuser"){const nm=val("u1"),em=val("u2"),pw=val("u3"),ro=val("u4");if(!em||pw.length<6)return alert("Вкажіть email і пароль від 6 символів");
  try{const sa=getAuth(initializeApp(fapp.options,"sec"+Date.now())),cr=await createUserWithEmailAndPassword(sa,em,pw);await signOut(sa);await setDoc(doc(fdb,"users",cr.user.uid),{email:em,name:nm||em,role:ro,active:true});logAct("Подія","Створено користувача "+em);d.close()}catch(x){alert("Помилка: "+(x.code||x.message))}}
 else if(a==="tgl"){const u=S.users.find(x=>x.id===id);if(u){await setDoc(doc(fdb,"users",id),{active:!u.active},{merge:true});logAct("Подія",(u.active?"Вимкнено користувача ":"Увімкнено користувача ")+u.email)}}
 else if(a==="rst"){const u=S.users.find(x=>x.id===id);if(u&&confirm("Надіслати лист для скидання пароля на "+u.email+"?"))sendPasswordResetEmail(auth,u.email).then(()=>alert("Лист надіслано")).catch(x=>alert("Помилка: "+x.code))}
 else if(a==="addp")formP();else if(a==="editp")formP(S.printers.find(p=>p.id===id));
 else if(a==="savep"){const o={...(S.printers.find(p=>p.id===id)||{}),id:id||uid(),m:val("f1"),sn:val("f2"),fmt:val("f3"),ct:val("f4"),orig:val("f5"),rep:val("f6"),ip:val("f7"),loc:val("f8"),desc:val("f9"),cnt:num(val("f10")),load:num(val("f11")),res:num(val("f12"))};if(!o.m)return alert("Вкажіть виробника");d.close();save("printers",o)}
 else if(a==="delp"){if(confirm("Видалити принтер?")){d.close();del("printers",id)}}
 else if(a==="work")formW(id||"");
 else if(a==="savew"){const o={id:uid(),ts:Date.now(),pid:val("w1"),date:val("w2")||today(),type:val("w3"),fault:val("w4"),done:val("w5"),cost:num(val("w6")),cnt:num(val("w7"))},sid=val("w8");if(!o.pid)return alert("Оберіть принтер");
  if(sid){const s=S.stock.find(x=>x.id===sid);if(s){o.part=s.name;s.qty=Math.max(0,Math.round((num(s.qty)-1)*10)/10);save("stock",s)}}
  const p=S.printers.find(x=>x.id===o.pid);if(p&&o.cnt>num(p.cnt)){p.cnt=o.cnt;save("printers",p)}d.close();save("works",o)}

 else if(a==="qr"){const p=S.printers.find(x=>x.id===id);dlg(`<h3>QR: ${esc(p.m)} ${esc(p.sn)}</h3><p class=mu>Роздрукуйте й наклейте на принтер. Скан відкриє його картку.</p><div id=qr style="background:#fff;padding:12px;display:inline-block"></div><div class=row style="margin-top:10px"><button data-a=x>Закрити</button></div>`);try{new QRCode($("#qr"),{text:location.href.split("#")[0]+"#p="+p.id,width:200,height:200})}catch(x){$("#qr").textContent="QR недоступний"}}
 else if(a==="adds")formS();else if(a==="edits")formS(S.stock.find(s=>s.id===id));
 else if(a==="saves"){const nm=val("s1"),old=S.stock.find(x=>x.id===id);if(!nm)return;const o={id:nm,name:nm,qty:num(val("s2")),_old:old?old.name:nm};if(old&&old.id!==nm)S.stock=S.stock.filter(x=>x.id!==old.id);d.close();save("stock",o)}
 else if(a==="dels"){if(confirm("Видалити?")){d.close();del("stock",id)}}

 else if(a==="csv"){const ws=fw().sort((x,y)=>x.date.localeCompare(y.date)),c=v=>{let t=String(v??"");if(/^[=+\-@\t\r]/.test(t))t="'"+t;return`"${t.replace(/"/g,'""')}"`};
  const data="\ufeff"+["Дата;Принтер;Тип;Несправність;Що зроблено;Вартість;Лічильник"].concat(ws.map(w=>[fmt(w.date),pname(S.printers.find(p=>p.id===w.pid)),w.type,w.fault,w.done,w.cost,w.cnt].map(c).join(";"))).join("\n");
  const u=URL.createObjectURL(new Blob([data],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="роботи_"+today()+".csv";document.body.appendChild(l);l.click();l.remove()}
});

document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;render()}});

function start(){if(started)return;started=true;
 if(ME.role==="admin")onSnapshot(query(collection(fdb,"audit"),orderBy("t","desc"),limit(300)),sn=>{AUD=sn.docs.map(d=>{const x=d.data();return{t:new Date(x.t).toLocaleString("uk-UA"),u:x.email,a:x.a,d:x.d}});render()},()=>{});
 if(ME.role==="admin")onSnapshot(collection(fdb,"users"),sn=>{S.users=sn.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{});
 ["works","meta"].forEach(c=>onSnapshot(collection(fdb,c),sn=>{S[c]=sn.docs.map(d=>({...d.data(),id:d.id}));render();notify()},e=>alert("Помилка доступу до бази: "+(e.code||e.message))));
 gsLoad().then(()=>{const h=location.hash.match(/p=(\w+)/);if(h){const p=S.printers.find(x=>x.id===h[1]);if(p){view="printers";q=p.sn||p.m;render()}}});
 setInterval(gsLoad,45000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)gsLoad()});
 setInterval(notify,36e5)}
try{const t=localStorage.getItem("pt_th");if(t)document.documentElement.dataset.theme=t}catch(e){}
onAuthStateChanged(auth,async u=>{
 if(!u){ME=null;ST="login";render();return}
 try{let sn=await getDoc(doc(fdb,"users",u.uid));
  if(!sn.exists()&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){await setDoc(doc(fdb,"users",u.uid),{email:u.email,name:"Адмін",role:"admin",active:true});sn=await getDoc(doc(fdb,"users",u.uid))}
  if(!sn.exists()&&REG){await setDoc(doc(fdb,"users",u.uid),{email:u.email,name:REG.name,role:"pending",active:true});REG=null;sn=await getDoc(doc(fdb,"users",u.uid))}
  if(!sn.exists()||sn.data().active!==true){NOPROF=!sn.exists();ME=null;ST="noaccess";render();return}
  ME={uid:u.uid,...sn.data()};ST="ok";render();start();
  if(ME.role==="pending")gsPost({op:"notifyNew"}).catch(()=>{});
  onSnapshot(doc(fdb,"users",u.uid),s2=>{const d2=s2.data();if(!d2||!ME)return;if(d2.active!==true||d2.role!==ME.role){location.reload();return}ME={uid:u.uid,...d2};render()},()=>{})}catch(e){ME=null;ST="noaccess";ERR=e.code||e.message;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="lp"){const b=document.querySelector("[data-a=login]");if(b)b.click()}});
$("#dg").addEventListener("close",stopScan);
render();
